name: Build & Release Rewardly APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for build script
        run: chmod +x ./build-release-apk.sh

      - name: Build Signed Release APK
        run: ./build-release-apk.sh

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rewardly-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Rewardly v1.0.0 (Release APK)"
          body: |
            ### Rewardly Android App
            Download and install `app-release.apk` directly on your Android device.
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
